name: Build Windows app

on:
  push:
    branches: [tartiba-planner, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Build installer and portable app
        run: |
          set -o pipefail
          npx electron-builder --win nsis portable --publish never 2>&1 | tee build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Show build errors
        if: failure()
        run: tail -n 25 build.log | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Tartiba-Windows
          path: dist/*.exe
          if-no-files-found: error
