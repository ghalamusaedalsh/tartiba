[package]
name = "tartiba"
version = "0.1.0"
description = "Tartiba (ترتيبة) — a planner and notes app for Windows"
authors = ["Ghala"]
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the app binary on Windows.
name = "tartiba_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
